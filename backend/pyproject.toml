[project]
name = "llm-tokenhub-backend"
version = "0.1.0"
description = "LLM Gateway / AI 中台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.0.0",
    "email-validator>=2.0.0",
    "httpx>=0.28.0",
    "alembic>=1.14.0",
    "cryptography>=44.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "redis>=5.2.0",
    "pgvector>=0.3.0",
    "python-multipart>=0.0.18",
    # 知识库解析引擎（任务 3）：PDF 文本层 / DOCX 标题层级 / XLSX 行列
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "tzdata>=2024.1",  # Windows 下 zoneinfo 需要 IANA 时区数据（业务时区到期换算）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "fpdf2>=2.8.0",  # 仅用于生成含中文的 PDF 测试夹具
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# 本地对接真实上游的手工脚本（含密钥），不参与 CI / 全量回归收集
addopts = "--ignore=tests/test_openai.py --ignore=tests/test_url_key.py"
